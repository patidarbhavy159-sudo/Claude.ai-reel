name: Render Low-Poly Video

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP Project
        run: |
          unzip pig-war-project.zip -d project
          cd project
          ls -la

      - name: Set up Node.js / Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Build and Render
        run: |
          cd project
          if [ -f "package.json" ]; then
            npm install
            npm run build || echo "No build script"
          fi
          # Add your render execution script or commands here
          echo "Rendering process completed!"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: project/*.mp4
